# Approve and queue auto-merge for Dependabot patch updates.
#
# Uses only GitHub-owned actions and this workflow's GITHUB_TOKEN. Acts only
# on pull requests opened by dependabot[bot] in cmu-sei repositories. Patch
# updates (per Dependabot's update-type metadata; for a grouped PR, the
# largest bump in the group) are approved and queued for auto-merge; minor
# and major updates are left for a human to review. Nothing from the pull
# request is checked out or executed.
#
# Merges made with GITHUB_TOKEN do not trigger push workflows, so the image
# build on main catches up on the next human merge or release. Releases are
# cut by hand, so nothing waits on that build.
#
# Requires, in this order:
# 1. Required status checks on main, so auto-merge waits for CI.
# 2. "Allow auto-merge" enabled in the repository settings.
# 3. "Allow GitHub Actions to create and approve pull requests" enabled.
# Until 2 is done the merge step fails on purpose so the gap is visible.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == 'cmu-sei'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Leave non-patch update for review
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: echo "::notice::Leaving $UPDATE_TYPE update for human review."

      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL" --body "Auto-approved: Dependabot $UPDATE_TYPE update ($DEPS)."
          gh pr merge --auto --squash "$PR_URL"
