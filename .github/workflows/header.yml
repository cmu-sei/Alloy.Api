name: Header_Check

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # the action commits and pushes missing headers
    steps:
      - uses: cmu-sei/Crucible-Github-Actions/actions/header@header-v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
